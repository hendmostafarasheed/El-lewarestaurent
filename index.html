<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080706"><meta name="description" content="EL LEWA Kebab & Kofta — traditional taste, modern experience.">
<title>EL LEWA | Kebab & Kofta</title><link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
<main class="poster-shell home-shell">
  <img class="poster-art" src="home-el-lewa.png" alt="EL LEWA Kebab & Kofta — luxury restaurant invitation in New Cairo">
  <div class="gold-rain" aria-hidden="true"></div>
  <a class="image-hotspot open-menu-hotspot" href="menu.html" aria-label="Open Menu"></a>
  <button class="image-hotspot home-location-hotspot" type="button" data-modal="location" aria-label="Restaurant location information"></button>
  <button class="image-hotspot home-opening-hotspot" type="button" data-modal="opening" aria-label="Opening information"></button>
  <button class="image-hotspot home-experience-hotspot" type="button" data-modal="experience" aria-label="Dining experience information"></button>

<div class="modal" id="info-modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card"><button class="modal-close" aria-label="Close">×</button><div class="modal-mark">EL LEWA</div><h2 id="modal-title">Welcome to EL LEWA</h2><p id="modal-copy"></p><a class="gold-button" href="menu.html">OPEN MENU <span aria-hidden="true">↗</span></a></div>
</div>
<audio id="site-music" src="el-lewa-music.mp3" loop preload="auto"></audio>
<button id="music-toggle" class="music-toggle" type="button" aria-label="Play background music">♫ PLAY MUSIC</button>
<script src="site.js"></script>
